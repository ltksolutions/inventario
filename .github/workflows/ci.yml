name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bumped 22.22.3 → 24.15.0 (Active LTS since Oct 2025, latest patch as of
  # May 2026, supported until Apr 2028). Earlier attempt at 22.22.3 fought
  # with Vercel "Production Override" locked to Node 24.x on existing
  # asset-management-api project, causing build fail at Vercel runtime
  # selection. Moving to Node 24 LTS aligns CI workflows with Vercel
  # default and unblocks @types/node 25 dependabot defer for future.
  # Includes V8 13.x performance gains and npm 11 (we use pnpm so npm
  # version is moot for our workflows). Local dev needs `nvm install 24.15.0`.
  NODE_VERSION: "24.15.0"
  PNPM_VERSION: "9.12.0"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Lint, typecheck, build — fast feedback on code quality
  # ─────────────────────────────────────────────────────────────────
  quality:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Unit tests
  #
  # Why 30 minutes:
  #   Integration tests hit MongoDB Atlas Flex in eu-region from GitHub
  #   Actions runners in US East. The round-trip latency is roughly
  #   5-6x what we see on a developer machine in Slovakia (~3.5 min
  #   locally), so 327 tests run ~13-18 min on CI. 30 min gives
  #   comfortable headroom for transient Atlas spikes without masking
  #   a genuinely runaway test.
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    # Same reasoning as the openapi job below — dependabot PRs don't get
    # repo secrets, and integration tests need a real Atlas connection.
    # Skipping for dependabot keeps their PRs unblocked on quality
    # signals (lint + typecheck + build), which is what we actually
    # want for dep bumps.
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          # Integration tests need an Atlas connection and Entra app
          # registration metadata. Stored as repo secrets and pointed
          # at the dev cluster whose Network Access
          # allows 0.0.0.0/0 for CI reachability. Unit tests don't read
          # these env vars, so leaving them set has no effect there.
          MONGO_URI: ${{ secrets.MONGO_URI_TEST }}
          ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID_TEST }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID_TEST }}

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: "**/coverage/**"
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────
  # Job 3: OpenAPI freshness check — the openapi.json committed to git
  # must match what `pnpm openapi:export:offline` would produce from the
  # current source. Uses MongoMemoryServer (no Atlas needed) so the check
  # runs on all PRs including dependabot.
  # ──────────────────────────────────────────────────────────────
  openapi:
    name: OpenAPI Spec Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm --filter @inventario/shared-types build

      - name: Check openapi.json is up to date
        run: pnpm --filter @inventario/api openapi:export:offline -- --check

  # ─────────────────────────────────────────────────────────────────
  # Job 4b: REUSE 3.3 compliance — každý tracked súbor musí mať licenciu
  # + copyright (inline SPDX hlavička alebo .reuse/REUSE.toml). Beží aj
  # pre dependabota (žiadne secrets, žiadny pnpm install).
  # ─────────────────────────────────────────────────────────────────
  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: REUSE lint
        uses: fsfe/reuse-action@v5

  # ─────────────────────────────────────────────────────────────────
  # Job 5: Commitlint — overiť, že commit messages spĺňajú konvenciu
  # (len pre PR, na main commity sa už nedá vrátiť)
  # ─────────────────────────────────────────────────────────────────
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
