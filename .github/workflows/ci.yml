name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bumped 22.22.3 → 24.15.0 (Active LTS since Oct 2025, latest patch as of
  # May 2026, supported until Apr 2028). Earlier attempt at 22.22.3 fought
  # with Vercel "Production Override" locked to Node 24.x on existing
  # asset-management-api project, causing build fail at Vercel runtime
  # selection. Moving to Node 24 LTS aligns CI workflows with Vercel
  # default and unblocks @types/node 25 dependabot defer for future.
  # Includes V8 13.x performance gains and npm 11 (we use pnpm so npm
  # version is moot for our workflows). Local dev needs `nvm install 24.15.0`.
  NODE_VERSION: "24.15.0"
  PNPM_VERSION: "9.12.0"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Lint, typecheck, build — fast feedback on code quality
  # ─────────────────────────────────────────────────────────────────
  quality:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Unit tests
  #
  # Why 30 minutes:
  #   Testy bežia proti in-process MongoDB (mongodb-memory-server,
  #   spúšťa ho tests/setup.ts), takže sieťová latencia na Atlas už
  #   nie je faktor. 30 min ostáva ako pohodlná rezerva pre pomalý
  #   cold-start runnera bez toho, aby maskovala reálne zaseknutý test.
  #
  # Pozn. (2026-08-30): testy nepotrebujú ŽIADNE repo secrets —
  #   tests/setup.ts bezpodmienečne prepíše MONGO_URI na in-memory
  #   inštanciu a ENTRA_* sú v config pluginu optional a v auth flow
  #   nepoužité (Slice #6c K17). Dead MONGO_URI_TEST /
  #   ENTRA_API_CLIENT_ID_TEST / ENTRA_TENANT_ID_TEST odstránené.
  #   Dôsledok: `if: github.actor != 'dependabot[bot]'` už nemalo
  #   pôvodné opodstatnenie (chýbajúce secrets).
  #
  # Pozn. (2026-08-31): tá podmienka ZRUŠENÁ — testy bežia aj na
  #   dependabot PR. Dôvod z praxe: argon2 0.45.1 obsahoval breaking
  #   change v typoch a odhalil sa až na typecheku. Typecheck chytí
  #   zmenu signatúry, ale nie zmenu správania — a argon2 hashuje
  #   heslá. Bez testov by taký bump prešiel len na tom, že sa to
  #   skompiluje.
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: "**/coverage/**"
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────
  # Job 3: OpenAPI freshness check — the openapi.json committed to git
  # must match what `pnpm openapi:export:offline` would produce from the
  # current source. Uses MongoMemoryServer (no Atlas needed) so the check
  # runs on all PRs including dependabot.
  # ──────────────────────────────────────────────────────────────
  openapi:
    name: OpenAPI Spec Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm --filter @inventario/shared-types build

      - name: Check openapi.json is up to date
        run: pnpm --filter @inventario/api openapi:export:offline -- --check

  # ─────────────────────────────────────────────────────────────────
  # Job 4b: REUSE 3.3 compliance — každý tracked súbor musí mať licenciu
  # + copyright (inline SPDX hlavička alebo .reuse/REUSE.toml). Beží aj
  # pre dependabota (žiadne secrets, žiadny pnpm install).
  # ─────────────────────────────────────────────────────────────────
  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: REUSE lint
        uses: fsfe/reuse-action@v6

  # ─────────────────────────────────────────────────────────────────
  # Job 5: Commitlint — overiť, že commit messages spĺňajú konvenciu
  # (len pre PR, na main commity sa už nedá vrátiť)
  # ─────────────────────────────────────────────────────────────────
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
