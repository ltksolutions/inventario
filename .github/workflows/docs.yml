name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Validate markdown — broken links, syntax, formatting
  # ─────────────────────────────────────────────────────────────────
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # continue-on-error odstránené 2026-08-31 — job je zelený a zase reálne
    # stráži. Predtým bol trvalo červený (71 mŕtvych odkazov) a nikto sa naň
    # nepozeral, čo je horšie než žiadna kontrola.
    #
    # Vyriešené: org rename jletko → ltksolutions, zaniknuté externé URL
    # (MCP docs, MongoDB blog, Ecomail), odkazy na nenapísané user-guide
    # návody (nahradené textom + TODO značkou), HTTP 202 z eur-lexu.
    # Domény, ktoré odmietajú bota, a zatiaľ nespustené vlastné stránky sú
    # v ignorePatterns — každá s komentárom, prečo tam je.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/markdown-link-check.json"
          folder-path: "docs"
          file-extension: ".md"

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Validate OpenAPI spec — schéma, sémantika
  # ─────────────────────────────────────────────────────────────────
  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # continue-on-error odstránené 2026-09-01 — Redocly hlási 0 chýb a job
    # zase reálne stráži. Doriešené: operationId (odvodzuje sa v
    # plugins/swagger.ts), nullable → type: [..., null] a booleovský
    # exclusiveMinimum (lib/openapi-3-1.ts), summary + security na 17
    # rotách, ktoré nemali schému.
    #
    # Zostáva 5 warningov, ktoré job nezhadzujú (2026-09-01, predtým 103):
    #   - no-ambiguous-paths (4) — /v1/assets/by-token/{publicToken}
    #     koliduje tvarom s /v1/assets/{id}/audit|qr|attachments|label.
    #     Oprava by znamenala premenovať endpointy, teda breaking change
    #     API aj zásah do apps/web. Vedome ponechané.
    #   - no-server-example (1) — localhost v servers, pre lokálny dev.
    #
    # operation-4xx-response (95 → 0): chybové odpovede sa dopĺňajú pri
    # generovaní dokumentu v plugins/swagger.ts, nie v response schémach
    # rout — response schéma je zároveň runtime serializér. Detaily:
    # docs/sessions/2026-09-01-openapi-chybove-odpovede.md

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Lint OpenAPI spec
        run: redocly lint docs/api/openapi.yaml
