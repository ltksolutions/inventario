name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Validate markdown — broken links, syntax, formatting
  # ─────────────────────────────────────────────────────────────────
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # continue-on-error odstránené 2026-08-31 — job je zelený a zase reálne
    # stráži. Predtým bol trvalo červený (71 mŕtvych odkazov) a nikto sa naň
    # nepozeral, čo je horšie než žiadna kontrola.
    #
    # Vyriešené: org rename jletko → ltksolutions, zaniknuté externé URL
    # (MCP docs, MongoDB blog, Ecomail), odkazy na nenapísané user-guide
    # návody (nahradené textom + TODO značkou), HTTP 202 z eur-lexu.
    # Domény, ktoré odmietajú bota, a zatiaľ nespustené vlastné stránky sú
    # v ignorePatterns — každá s komentárom, prečo tam je.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/markdown-link-check.json"
          folder-path: "docs"
          file-extension: ".md"

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Validate OpenAPI spec — schéma, sémantika
  # ─────────────────────────────────────────────────────────────────
  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # TODO: Remove continue-on-error once OpenAPI 3.1 syntax cleanup is done
    # (nullable: true → type: [..., null]) and operationId/4xx responses added.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Lint OpenAPI spec
        run: redocly lint docs/api/openapi.yaml
